

<script>
const nick=document.getElementById('nickname');
try{nick.value=localStorage.getItem('blackcity_nick')||'';}catch(e){}
nick.addEventListener('input',()=>{
try{localStorage.setItem('blackcity_nick',nick.value);}catch(e){}
});
function play(){
if(!nick.value.trim()){
alert('Сначала введи игровой ник!');
return;
}
alert('Ник сохранён! Игровой клиент пока не подключён.');
}
</script>
</body>
</html>
