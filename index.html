<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLACK CITY RP</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:25px 16px;background:#16090d;color:white;font-family:Arial,sans-serif}
.container{max-width:480px;margin:auto}
header{font-size:25px;font-weight:bold;letter-spacing:3px;color:#fff}
header span{color:#e13b4d}
.hero{text-align:center;margin:65px 0 35px}
.hero h1{font-size:40px;margin:12px 0}
.hero p{color:#c5aeb3}
.card{background:#291218;border:1px solid #642635;border-radius:16px;padding:20px;margin:15px 0}
label{display:block;color:#e5b66a;font-size:12px;margin-bottom:10px}
input{width:100%;padding:15px;background:#16090d;border:1px solid #71303e;border-radius:10px;color:white;font-size:16px}
.info{display:flex;justify-content:space-between;margin-top:16px;font-size:13px}
.info span{color:#c5aeb3}
.status{color:#e5b66a;font-size:11px}
.play{width:100%;padding:19px;border:0;border-radius:12px;background:#c6283d;color:white;font-size:20px;font-weight:bold;margin:15px 0}
.buttons{display:flex;gap:9px}
.buttons button{flex:1;padding:15px 5px;background:#291218;color:white;border:1px solid #642635;border-radius:10px}
footer{text-align:center;color:#806f73;font-size:11px;margin-top:30px}
</style>
</head>
<body>
<div class="container">

<header><span>B</span> BLACK CITY</header>

<section class="hero">
<p>ТВОЯ ИСТОРИЯ НАЧИНАЕТСЯ ЗДЕСЬ</p>
<h1>BLACK CITY</h1>
<p>Добро пожаловать в город возможностей</p>
</section>

<div class="card">
<label>ИГРОВОЙ НИК</label>
<input id="nickname" placeholder="Введи свой ник" maxlength="24">
</div>

<div class="card">
<b>BLACK CITY | СЕРВЕР 1</b>
<p class="status">● СТАТУС НЕ ПРОВЕРЕН</p>
<div class="info"><span>IP</span><b>188.127.241.74</b></div>
<div class="info"><span>ПОРТ</span><b>2581</b></div>
<div class="info"><span>ОНЛАЙН</span><b>Неизвестно</b></div>
</div>

<button class="play" onclick="play()">▶ ИГРАТЬ</button>

<div class="buttons">
<button onclick="alert('Форум пока не подключён')">ФОРУМ</button>
<button onclick="alert('Донат пока не подключён')">ДОНАТ</button>
<button onclick="alert('Настройки BLACK CITY')">НАСТРОЙКИ</button>
</div>

<footer>BLACK CITY RP · VERSION 0.1</footer>
</div>

<script>
const nick=document.getElementById('nickname');
try{nick.value=localStorage.getItem('blackcity_nick')||'';}catch(e){}
nick.addEventListener('input',()=>{
try{localStorage.setItem('blackcity_nick',nick.value);}catch(e){}
});
function play(){
if(!nick.value.trim()){
alert('Сначала введи игровой ник!');
return;
}
alert('Ник сохранён! Игровой клиент пока не подключён.');
}
</script>
</body>
</html>
